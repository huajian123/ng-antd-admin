<!--头部版块-->
<app-page-header [pageHeaderInfo]="pageHeaderInfo" />

<div class="normal-table-wrap">
  <nz-card>
    <app-water-mark />
    <form class="form-wrap" nz-form>
      <nz-form-item>
        <nz-form-label nzFor="title" nzRequired [nzSm]="6" [nzXs]="24">标题</nz-form-label>
        <nz-form-control nzErrorTip="请输入标题" [nzSm]="14" [nzXs]="24">
          <input id="title" nz-input placeholder="给目标起个名字" [formField]="validateForm.title" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzFor="date" nzRequired [nzSm]="6" [nzXs]="24">起止日期</nz-form-label>
        <nz-form-control nzErrorTip="请选择起止日期" [nzSm]="14" [nzXs]="24">
          <nz-range-picker class="with-full" [formField]="validateForm.date"></nz-range-picker>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzFor="desc" nzRequired [nzSm]="6" [nzXs]="24">目标描述</nz-form-label>
        <nz-form-control nzErrorTip="请输入目标描述" [nzSm]="14" [nzXs]="24">
          <textarea id="desc" nz-input placeholder="请输入你的阶段性工作目标" rows="4" [formField]="validateForm.desc"></textarea>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzFor="standard" nzRequired [nzSm]="6" [nzXs]="24">衡量标准</nz-form-label>
        <nz-form-control nzErrorTip="请输入衡量标准" [nzSm]="14" [nzXs]="24">
          <textarea id="standard" nz-input placeholder="请输入衡量标准" rows="4" [formField]="validateForm.standard"></textarea>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzFor="client" nzTooltipTitle="目标的服务对象" [nzSm]="6" [nzXs]="24">客户</nz-form-label>
        <nz-form-control [nzSm]="14" [nzXs]="24">
          <input id="client" nz-input placeholder="请描述你服务的客户，内部客户直接@姓名/工号" [formField]="validateForm.client" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzFor="invitedCommenter" [nzSm]="6" [nzXs]="24">邀评人</nz-form-label>
        <nz-form-control [nzSm]="14" [nzXs]="24">
          <input id="invitedCommenter" nz-input placeholder="请直接@姓名/工号，最多可邀请5人" [formField]="validateForm.invitedCommenter" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzFor="weights" [nzSm]="6" [nzXs]="24">权重</nz-form-label>
        <nz-form-control [nzSm]="14" [nzXs]="24">
          <nz-input-number id="weights" nzPlaceHolder="请输入" [formField]="validateForm.weights" [nzStep]="1"></nz-input-number>
          %
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="public" [nzSm]="6" [nzXs]="24">目标公开</nz-form-label>
        <nz-form-control nz-row nzExtra="客户、邀评人默认被分享" [nzSm]="14" [nzXs]="24">
          <nz-radio-group id="public" [formField]="validateForm.isPublic">
            <label nz-radio nzValue="1">公开</label>
            <label nz-radio nzValue="2">部分公开</label>
            <label nz-radio nzValue="3">不公开</label>
          </nz-radio-group>
          @if (formModel().isPublic === '2') {
            <nz-select class="m-t-5" nzMode="tags" nzPlaceHolder="Please select">
              @for (option of listOfOption; track option) {
                <nz-option [nzLabel]="option.label" [nzValue]="option.value"></nz-option>
              }
            </nz-select>
          }
        </nz-form-control>
      </nz-form-item>
      <nz-form-item nz-row>
        <nz-form-control [nzOffset]="6" [nzSpan]="14">
          <button type="button" nz-button nzType="primary" (click)="submitForm()">提交</button>
          <button class="m-l-10" type="button" nz-button nzType="default">保存</button>
        </nz-form-control>
      </nz-form-item>
    </form>
  </nz-card>
</div>
